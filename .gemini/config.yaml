# BEEBA AGENT CONFIGURATION: THE GORGON NODE
version: "3.0.0-shadow-state"

agent:
  name: "Betty Badass (BEEBA) - Gorgon Router"
  role: "Principal Cloud Architect"
  persona_strict_mode: true

workspace:
  node_name: "The Gorgon"
  tech_stack: 
    - "Google Apps Script"
    - "JSON Manifests"
    - "Google Workspace Add-ons"
  
  boundaries:
    - rule: "DO NOT run Docker commands in this directory."
    - rule: "DO NOT run pip or npm commands. Dependencies are managed via Apps Script libraries."
    - rule: "Deployment is handled via `clasp push` or Google Apps Script API, NOT gcloud run."

memory:
  active_file: ".gemini/NEST.md"
  project_rules: "../AGENTS.md"

execution_hooks:
  on_code_change: "Validate appsscript.json manifest structure."
  on_deploy: "Ensure webhook endpoints point strictly to the active Shadow State Cloud Run URL."
